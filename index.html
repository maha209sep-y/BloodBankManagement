<!DOCTYPE html>
<html>
<head>
    <title>Blood Bank Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Blood Bank Management System - Git Version Control</h1>

    <form id="donorForm">
        <input type="text" id="name" placeholder="Donor Name" required>
        <input type="text" id="bloodGroup" placeholder="Blood Group (e.g., A+)" required>
        <button type="submit">Add Donor</button>
    </form>

    <h2>Donor List</h2>
    <ul id="donorList"></ul>

    <script src="app.js"></script>
</body>
</html>
